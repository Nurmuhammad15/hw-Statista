<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Statista</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:       #0d0f14;
    --surface:  #161b25;
    --surface2: #1e2538;
    --border:   #2a3347;
    --accent:   #4f8ef7;
    --accent2:  #7b5cf5;
    --green:    #22c887;
    --red:      #f7556a;
    --amber:    #f5a623;
    --text:     #e8edf5;
    --muted:    #7a8499;
    --white:    #ffffff;
    --r:        14px;
    --rsm:      8px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  header {
    background: rgba(22, 27, 37, 0.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header b {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  #webviewWarning {
    display: none;
    background: #2a1f08;
    color: var(--amber);
    border-bottom: 1px solid #4a3510;
    padding: 10px 16px;
    font-size: 13px;
    text-align: center;
    font-weight: 500;
  }

  #helpBtn {
    background: rgba(79,142,247,0.1);
    color: var(--accent);
    border: 1px solid rgba(79,142,247,0.3);
    padding: 7px 13px;
    border-radius: var(--rsm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    white-space: nowrap;
  }
  #helpBtn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  .container {
    max-width: 600px;
    margin: 0 auto;
    padding: 28px 16px 80px;
  }

  h2 { font-size: 20px; font-weight: 800; color: var(--white); margin-bottom: 20px; }
  h3 { font-size: 17px; font-weight: 700; color: var(--white); margin-bottom: 16px; }
  h4 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 16px;
    margin-bottom: 10px;
    transition: border-color 0.2s;
  }

  button {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    border: none;
    border-radius: var(--rsm);
    cursor: pointer;
    padding: 12px 16px;
    transition: all 0.18s;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    line-height: 1;
  }

  .primary {
    background: linear-gradient(135deg, var(--accent), #3a7ef5);
    color: #fff;
    width: 100%;
    justify-content: flex-start;
    box-shadow: 0 2px 10px rgba(79,142,247,0.2);
  }
  .primary:hover { transform: translateY(-1px); box-shadow: 0 5px 18px rgba(79,142,247,0.35); }
  .primary:active { transform: translateY(0); }

  .secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    width: 100%;
    justify-content: flex-start;
  }
  .secondary:hover { border-color: var(--accent); color: var(--white); background: var(--border); }

  .danger {
    background: rgba(247,85,106,0.1);
    color: var(--red);
    border: 1px solid rgba(247,85,106,0.3);
    padding: 10px 14px;
  }
  .danger:hover { background: var(--red); color: #fff; border-color: var(--red); }

  .back {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 8px 13px;
    margin-bottom: 18px;
    font-size: 13px;
    width: auto;
  }
  .back:hover { background: var(--surface2); color: var(--text); }

  .green {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--green);
    font-weight: 700;
    font-size: 13px;
    background: rgba(34,200,135,0.1);
    border: 1px solid rgba(34,200,135,0.25);
    padding: 3px 10px;
    border-radius: 20px;
  }

  .red {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--red);
    font-weight: 700;
    font-size: 13px;
    background: rgba(247,85,106,0.08);
    border: 1px solid rgba(247,85,106,0.2);
    padding: 3px 10px;
    border-radius: 20px;
  }

  img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
    margin: 8px 6px 0 0;
  }

  label.primary, label.danger {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
    border-radius: var(--rsm);
    padding: 9px 14px;
    margin-top: 10px;
    transition: all 0.18s;
    line-height: 1;
  }
  label.primary {
    background: linear-gradient(135deg, var(--accent), #3a7ef5);
    color: #fff;
    box-shadow: 0 2px 10px rgba(79,142,247,0.2);
  }
  label.primary:hover { transform: translateY(-1px); box-shadow: 0 5px 18px rgba(79,142,247,0.35); }
  label.danger {
    background: rgba(247,85,106,0.1);
    color: var(--red);
    border: 1px solid rgba(247,85,106,0.3);
  }
  label.danger:hover { background: var(--red); color: #fff; }

  input[type=file] { display: none; }

  .hw {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--rsm);
    padding: 14px;
    margin-bottom: 8px;
  }
  .hw b { font-size: 14px; color: var(--text); display: block; margin-bottom: 8px; }

  .home-wrap { padding-top: 40px; text-align: center; }
  .home-title {
    font-size: 32px;
    font-weight: 800;
    font-family: 'Space Mono', monospace;
    background: linear-gradient(135deg, #fff 0%, var(--muted) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }
  .home-sub { color: var(--muted); font-size: 14px; margin-bottom: 36px; }
  .home-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    max-width: 380px;
    margin: 0 auto;
  }
  .home-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 28px 16px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .home-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,0.3); }
  .home-card.student { border-top: 3px solid var(--accent); }
  .home-card.teacher { border-top: 3px solid var(--accent2); }
  .home-card .label { font-weight: 700; font-size: 15px; color: var(--white); }
  .home-card .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .admin-group-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 16px;
    margin-bottom: 10px;
  }
  .admin-group-name { font-weight: 700; font-size: 14px; color: var(--white); margin-bottom: 12px; }
  .admin-group-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .admin-group-actions .primary { width: auto; flex: 1; }

  .admin-student-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 14px 16px;
    margin-bottom: 8px;
  }
  .admin-student-name {
    font-weight: 700; font-size: 14px; color: var(--white);
    margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .hw-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; gap: 8px;
  }
  .hw-row:last-child { border-bottom: none; }
  .hw-row-name { color: var(--muted); flex: 1; }

  .export-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(34,200,135,0.1); color: var(--green);
    border: 1px solid rgba(34,200,135,0.3);
    padding: 9px 16px; border-radius: var(--rsm);
    font-size: 13px; font-weight: 600; cursor: pointer;
    margin-bottom: 18px; font-family: 'Plus Jakarta Sans', sans-serif;
    transition: all 0.2s; width: auto;
  }
  .export-btn:hover { background: var(--green); color: var(--bg); }

  .step-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 18px 18px 18px 64px;
    margin-bottom: 10px; position: relative;
  }
  .step-num {
    position: absolute; left: 16px; top: 16px;
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; font-weight: 800; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Mono', monospace;
  }
  .step-title { font-weight: 700; color: var(--white); margin-bottom: 5px; font-size: 15px; }
  .step-body { font-size: 13px; color: var(--muted); line-height: 1.7; }
  .step-body ul { padding-left: 16px; margin-top: 6px; }
  .step-body b { color: var(--text); }

  .alert-card {
    background: rgba(245,166,35,0.08); border: 1px solid rgba(245,166,35,0.3);
    border-radius: var(--r); padding: 14px 16px; margin-bottom: 10px;
    font-size: 13px; color: var(--amber); line-height: 1.7;
  }
  .alert-card ul { padding-left: 16px; margin-top: 6px; }
  .alert-card b { color: #ffc542; }

  .bc {
    font-size: 12px; color: var(--muted); margin-bottom: 14px;
    display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
  }
  .bc b { color: var(--accent); }

  .loading {
    text-align: center; padding: 50px 20px;
    color: var(--muted); font-size: 14px;
  }
  .loading::before {
    content: ''; display: block; width: 30px; height: 30px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    z-index: 999;
    animation: fadeIn 0.15s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px 28px;
    width: 100%;
    max-width: 360px;
    margin: 16px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    animation: slideUp 0.2s ease;
  }
  @keyframes slideUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }

  .modal-title { font-size: 18px; font-weight: 800; color: var(--white); margin-bottom: 6px; }
  .modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
  .modal-field { margin-bottom: 14px; }
  .modal-field label {
    display: block; font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
  }
  .modal-field input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--rsm); padding: 12px 14px; font-size: 14px;
    font-family: inherit; color: var(--text); outline: none; transition: border-color 0.2s;
  }
  .modal-field input:focus { border-color: var(--accent); }
  .modal-error { font-size: 13px; color: var(--red); margin-bottom: 14px; min-height: 18px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .modal-actions .primary { flex: 1; justify-content: center; }
  .modal-actions .btn-cancel {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    padding: 12px 18px; border-radius: var(--rsm); font-family: inherit;
    font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.18s;
  }
  .modal-actions .btn-cancel:hover { background: var(--surface2); color: var(--text); }

  .btn-new-group {
    background: rgba(34,200,135,0.1); color: var(--green);
    border: 1px solid rgba(34,200,135,0.3); padding: 9px 16px;
    border-radius: var(--rsm); font-family: inherit; font-weight: 700;
    font-size: 13px; cursor: pointer; transition: all 0.18s; white-space: nowrap; width: auto;
  }
  .btn-new-group:hover { background: var(--green); color: var(--bg); }

  .btn-delete-group {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    padding: 10px 14px; border-radius: var(--rsm); font-family: inherit;
    font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.18s; white-space: nowrap; width: auto;
  }
  .btn-delete-group:hover { background: var(--red); color: #fff; border-color: var(--red); }

  #notifBell {
    position: relative; width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--rsm); cursor: pointer; color: var(--muted);
    transition: all 0.2s; flex-shrink: 0;
  }
  #notifBell:hover { border-color: var(--accent); color: var(--accent); }
  #notifBell.has-notif { color: var(--accent); border-color: rgba(79,142,247,0.4); }

  #notifBadge {
    position: absolute; top: -5px; right: -5px;
    background: var(--red); color: #fff; font-size: 10px; font-weight: 800;
    min-width: 18px; height: 18px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 4px; font-family: 'Space Mono', monospace; pointer-events: none;
  }

  #notifOverlay { position: fixed; inset: 0; z-index: 199; }
  #notifPanel {
    position: fixed; top: 68px; right: 16px; width: 320px; max-height: 440px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    z-index: 200; overflow: hidden; display: flex; flex-direction: column;
    animation: slideDown 0.18s ease;
  }
  @keyframes slideDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }

  #notifPanelHeader {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  #notifClearBtn {
    background: transparent; color: var(--muted); border: none; font-size: 12px;
    font-weight: 600; cursor: pointer; font-family: inherit; padding: 4px 8px;
    border-radius: 4px; width: auto; transition: color 0.15s;
  }
  #notifClearBtn:hover { color: var(--red); }
  #notifList { overflow-y: auto; flex: 1; padding: 8px; }
  .notif-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 28px 16px; }
  .notif-item {
    padding: 12px 14px; border-radius: var(--rsm); margin-bottom: 6px;
    border-left: 3px solid transparent; background: var(--bg); transition: background 0.15s; cursor: default;
  }
  .notif-item:last-child { margin-bottom: 0; }
  .notif-item.unread { background: rgba(79,142,247,0.06); }
  .notif-item.type-reminder { border-left-color: var(--amber); }
  .notif-item.type-blocked  { border-left-color: var(--red); }
  .notif-item.type-info     { border-left-color: var(--accent); }
  .notif-item.type-success  { border-left-color: var(--green); }
  .notif-title { font-size: 13px; font-weight: 700; color: var(--white); margin-bottom: 3px; }
  .notif-body { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .notif-time { font-size: 11px; color: var(--border); margin-top: 5px; font-family: 'Space Mono', monospace; }

  .schedule-banner {
    border-radius: var(--rsm); padding: 12px 16px; font-size: 13px;
    font-weight: 600; margin-bottom: 14px; text-align: center;
  }
  .warning-banner { background: rgba(245,166,35,0.12); border: 1px solid rgba(245,166,35,0.4); color: var(--amber); }
  .blocked-banner { background: rgba(247,85,106,0.1); border: 1px solid rgba(247,85,106,0.35); color: var(--red); }

  /* AI DETECTION */
  .ai-detect-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--rsm);
    padding: 14px 16px;
    margin-bottom: 18px;
  }
  .ai-detect-title {
    font-size: 12px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
  }
  .ai-detect-bar-wrap {
    position: relative;
    height: 28px;
    border-radius: 20px;
    overflow: hidden;
    background: var(--surface2);
    margin-bottom: 10px;
  }
  .ai-detect-bar-human {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, var(--green), #1aad74);
    border-radius: 20px 0 0 20px;
    display: flex; align-items: center; justify-content: flex-start;
    padding-left: 12px;
    font-size: 12px; font-weight: 800; color: #fff;
    font-family: 'Space Mono', monospace;
    transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
    min-width: 50px;
  }
  .ai-detect-bar-ai {
    position: absolute; right: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, #7c3aed, var(--accent2));
    border-radius: 0 20px 20px 0;
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 12px;
    font-size: 12px; font-weight: 800; color: #fff;
    font-family: 'Space Mono', monospace;
    transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
    min-width: 50px;
  }
  .ai-detect-labels {
    display: flex; justify-content: space-between; align-items: center;
  }
  .ai-detect-label-human {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 700; color: var(--green);
  }
  .ai-detect-label-ai {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 700; color: var(--accent2);
  }
  .ai-detect-dot {
    width: 8px; height: 8px; border-radius: 50%;
  }
  .ai-detect-note {
    font-size: 12px; color: var(--muted); margin-top: 10px;
    padding-top: 10px; border-top: 1px solid var(--border);
    line-height: 1.5; font-style: italic;
  }

  /* ========== AI CHECKER STYLES ========== */
  .ai-check-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, rgba(123,92,245,0.15), rgba(79,142,247,0.15));
    color: #a78bfa;
    border: 1px solid rgba(123,92,245,0.4);
    padding: 8px 13px;
    border-radius: var(--rsm);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 10px;
    width: auto;
    white-space: nowrap;
  }
  .ai-check-btn:hover {
    background: linear-gradient(135deg, rgba(123,92,245,0.35), rgba(79,142,247,0.25));
    border-color: rgba(123,92,245,0.7);
    color: #c4b5fd;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(123,92,245,0.25);
  }
  .ai-check-btn svg { flex-shrink: 0; }

  /* AI Checker Modal */
  .ai-modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(8px);
    display: flex; align-items: flex-end;
    justify-content: center;
    z-index: 1000;
    animation: fadeIn 0.15s ease;
  }

  @media (min-height: 600px) {
    .ai-modal-overlay { align-items: center; }
  }

  .ai-modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 32px;
    width: 100%;
    max-width: 640px;
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: 0 -20px 60px rgba(0,0,0,0.6);
    animation: slideUpModal 0.25s ease;
    position: relative;
  }

  @media (min-height: 600px) {
    .ai-modal {
      border-radius: 20px;
      max-height: 88vh;
      margin: 16px;
    }
  }

  @keyframes slideUpModal {
    from { opacity:0; transform:translateY(30px); }

</style>

function setNav(view, payload){ try{ localStorage.setItem(NAV_KEY, JSON.stringify({ view, payload, t: Date.now() })); }catch(e){} }

  const nav = getNav();
  if(!nav || !nav.view){ home(); return; }

function isWritingTask(hwName) {
  const name = hwName.toLowerCase();
  return (
    name.includes("writing task 1") ||
    name.includes("writing task 2") ||
    name.includes("writing report") ||
    name.includes("task 1") ||
    name.includes("task 2") ||
    name.includes("essay") ||
    name.includes("report")
  );
}

function openAiCheckerById(hwId) {
  const hwName = window['_hw_' + hwId] || hwId;
  openAiChecker(hwName);
}

function openAiChecker(hwName) {
  document.getElementById("aiHwNameBadge").textContent = hwName;
  document.getElementById("aiEssayText").value = "";
  document.getElementById("aiResultArea").innerHTML = "";
  document.getElementById("aiCharCount").textContent = "0 words";
  document.getElementById("aiSubmitBtn").disabled = false;
  document.getElementById("aiCheckerModal").style.display = "block";
  setTimeout(() => document.getElementById("aiEssayText").focus(), 200);
}

function closeAiChecker(event) {
  if (event && event.target !== document.querySelector(".ai-modal-overlay")) return;
  document.getElementById("aiCheckerModal").style.display = "none";
}

function updateCharCount() {
  const text = document.getElementById("aiEssayText").value.trim();
  const words = text ? text.split(/\s+/).filter(w => w.length > 0).length : 0;
  document.getElementById("aiCharCount").textContent = words + " word" + (words !== 1 ? "s" : "");
}

function getTaskType(hwName) {
  const name = hwName.toLowerCase();
  if (name.includes("task 2") || name.includes("essay")) return "task2";
  return "task1";
}

  const taskType = getTaskType(hwName);

  document.getElementById("aiSubmitBtn").disabled = true;

async function compressImage(file, maxW=1280, quality=0.75){
  const img = document.createElement("img");
  const url = URL.createObjectURL(file);
  img.src = url;
  await new Promise(res => img.onload = res);
  const scale = Math.min(1, maxW / img.width);
  const w = Math.round(img.width * scale);
  const h = Math.round(img.height * scale);
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(img, 0, 0, w, h);
  URL.revokeObjectURL(url);
  const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", quality));
  if (!blob) return file;
  return new File([blob], file.name.replace(/\.\w+$/, ".jpg"), { type:"image/jpeg" });
}

async function deleteFilesByUrls(urls){

}

  const files = Array.from(input.files || []);
  if (files.length === 0) { alert("At least one photo is required."); return; }
  if (files.length > 4) { alert("Max 4 photos allowed."); input.value = ""; return; }
  let uploadedUrls = [];
  for (const file of files) {
    const filePath = `submissions/${safe(group)}/${safe(student)}/${safe(stage)}/${safe(lesson)}/${safe(hw)}/${Date.now()}_${safe(file.name)}`;
    const ref = storage.ref(filePath);
    const small = await compressImage(file);
    try { await ref.put(small); const url = await ref.getDownloadURL(); uploadedUrls.push(url); }
    catch(e) { alert("Upload failed: " + (e.message || e)); input.value = ""; return; }
  }
  await db.ref(`submissions/${group}/${student}/${stage}/${lesson}/${hw}`).set({ files: uploadedUrls, time: Date.now() });
  input.value = "";
  await showHomework(group, student, stage, lesson);
  alert("Submitted successfully ✓");
}

async function replaceHW(input, group, student, stage, lesson, hw) {
  const files = Array.from(input.files || []);
  if (files.length === 0) { alert("At least one photo is required."); return; }
  if (files.length > 4) { alert("Max 4 photos allowed."); input.value = ""; return; }
  const snap = await db.ref(`submissions/${group}/${student}/${stage}/${lesson}/${hw}`).once("value");
  const old = snap.val();
  const oldUrls = old && Array.isArray(old.files) ? old.files : [];
  await deleteFilesByUrls(oldUrls);
  let uploadedUrls = [];
  for (const file of files) {
    const filePath = `submissions/${safe(group)}/${safe(student)}/${safe(stage)}/${safe(lesson)}/${safe(hw)}/${Date.now()}_${safe(file.name)}`;
    const ref = storage.ref(filePath);
    const small = await compressImage(file);
    try { await ref.put(small); const url = await ref.getDownloadURL(); uploadedUrls.push(url); }
    catch(e) { alert("Upload failed: " + (e.message || e)); input.value = ""; return; }
  }
  await db.ref(`submissions/${group}/${student}/${stage}/${lesson}/${hw}`).set({ files: uploadedUrls, time: Date.now() });

}

function clearGroup(group){

async function exportLessonCSV(group, stage, lesson){
  const students = GROUPS[group];
  const homeworks = STAGES[stage][lesson];
  let csv = [["Student Name", ...homeworks].join(",")];
  for (const student of students) {
    let row = [student];
    for (const hw of homeworks) {
      const snap = await db.ref(`submissions/${group}/${student}/${stage}/${lesson}/${hw}`).once("value");
      const d = snap.val();
      row.push(d && Array.isArray(d.files) && d.files.length > 0 ? "Yes" : "No");
    }
    csv.push(row.join(","));
  }
  const blob = new Blob([csv.join("\n")], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${group} - ${stage} - ${lesson}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ========== SCHEDULE ========== */
const SCHEDULE = {
  "GROUP IELTS 9:00 M/W/F":    { days:[1,3,5], hour:9,  minute:0  },
  "GROUP IELTS 17:00 MWF":     { days:[1,3,5], hour:17, minute:0  },
  "GROUP IELTS M/W/F 14:00":   { days:[1,3,5], hour:14, minute:0  },
  "GROUP IELTS T/T/S 9:00":    { days:[2,4,6], hour:9,  minute:0  },
  "GROUP IELTS 10:30 TTS":     { days:[2,4,6], hour:10, minute:30 },
  "GROUP IELTS T/T/S 14:00":   { days:[2,4,6], hour:14, minute:0  },
  "GROUP IELTS 15:30 TTS":     { days:[2,4,6], hour:15, minute:30 },
  "GROUP IELTS T/T/S 18:30":   { days:[2,4,6], hour:18, minute:30 }
};

function minutesUntilLesson(group){
  const s = SCHEDULE[group]; if(!s) return null;
  const now = new Date(); const day = now.getDay();
  const nowMins = now.getHours() * 60 + now.getMinutes();
  const lessonMins = s.hour * 60 + s.minute;
  if(s.days.includes(day)) return lessonMins - nowMins;
  return null;
}

function isSubmissionBlocked(group){
  const mins = minutesUntilLesson(group);
  if(mins === null) return false;
  return mins <= 0 && mins >= -90;
}

const _origShowHomework = showHomework;
showHomework = async function(group, student, stage, lesson){
  await _origShowHomework(group, student, stage, lesson);
  const mins = minutesUntilLesson(group);
  const blocked = isSubmissionBlocked(group);
  const container = document.getElementById("app");
  if(!container) return;
  if(blocked){
    const banner = document.createElement("div");
    banner.className = "schedule-banner blocked-banner";
    banner.textContent = "Lesson has started — homework submission is now closed.";
    container.insertBefore(banner, container.children[2] || container.firstChild);
    container.querySelectorAll("input[type=file]").forEach(inp => inp.disabled = true);
    container.querySelectorAll("label.primary, label.danger").forEach(lbl => {
      lbl.style.opacity = "0.35"; lbl.style.pointerEvents = "none"; lbl.style.cursor = "not-allowed";
    });
  } else if(mins !== null && mins > 0 && mins <= 30){
    const banner = document.createElement("div");
    banner.className = "schedule-banner warning-banner";
    banner.textContent = `Lesson starts in ${mins} minute${mins===1?'':'s'} — submit any missing homework now!`;
    container.insertBefore(banner, container.children[2] || container.firstChild);
  }
};

const _origSubmitHW = submitHW;
submitHW = async function(input, group, student, stage, lesson, hw){
  if(isSubmissionBlocked(group)){ alert("Submission is closed — lesson has already started."); input.value = ""; return; }
  return _origSubmitHW(input, group, student, stage, lesson, hw);
};

const _origReplaceHW = replaceHW;
replaceHW = async function(input, group, student, stage, lesson, hw){
  if(isSubmissionBlocked(group)){ alert("Submission is closed — lesson has already started."); input.value = ""; return; }
  return _origReplaceHW(input, group, student, stage, lesson, hw);
};

/* ========== NOTIFICATIONS ========== */
const _notifStore = [];
let _notifUnread = 0;
function _notifTimeStr(){ const now = new Date(); return now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) + ' · ' + now.toLocaleDateString([], { day:'numeric', month:'short' }); }
function pushNotif(title, body, type='info'){ const item = { id: Date.now(), title, body, type, time: _notifTimeStr(), read: false }; _notifStore.unshift(item); if(_notifStore.length > 50) _notifStore.pop(); _notifUnread++; _renderBell(); _renderNotifList(); }
function _renderBell(){ const bell = document.getElementById('notifBell'); const badge = document.getElementById('notifBadge'); if(!bell||!badge) return; if(_notifUnread > 0){ badge.style.display='flex'; badge.textContent=_notifUnread>99?'99+':_notifUnread; bell.classList.add('has-notif'); } else { badge.style.display='none'; bell.classList.remove('has-notif'); } }
function _renderNotifList(){ const list = document.getElementById('notifList'); if(!list) return; if(_notifStore.length===0){ list.innerHTML='<div class="notif-empty">No notifications yet</div>'; return; } list.innerHTML=_notifStore.map(n=>`<div class="notif-item type-${n.type} ${n.read?'':'unread'}"><div class="notif-title">${n.title}</div><div class="notif-body">${n.body}</div><div class="notif-time">${n.time}</div></div>`).join(''); }
function toggleNotifPanel(){ const panel=document.getElementById('notifPanel'); const overlay=document.getElementById('notifOverlay'); const isOpen=panel.style.display!=='none'; if(isOpen){ closeNotifPanel(); } else { _notifStore.forEach(n=>n.read=true); _notifUnread=0; _renderBell(); _renderNotifList(); panel.style.display='flex'; overlay.style.display='block'; } }
function closeNotifPanel(){ document.getElementById('notifPanel').style.display='none'; document.getElementById('notifOverlay').style.display='none'; }
function clearAllNotifs(){ _notifStore.length=0; _notifUnread=0; _renderBell(); _renderNotifList(); }

(function initNotifications(){
  if(!("Notification" in window)||!("serviceWorker" in navigator)) return;
  const swCode=`self.addEventListener('message',e=>{if(e.data&&e.data.type==='NOTIFY'){self.registration.showNotification(e.data.title,{body:e.data.body,vibrate:[200,100,200],tag:e.data.tag||'statista',requireInteraction:true});}});self.addEventListener('notificationclick',e=>{e.notification.close();e.waitUntil(clients.matchAll({type:'window'}).then(list=>{if(list.length)return list[0].focus();return clients.openWindow('/');}));});`;
  let swReg=null;
  const blob=new Blob([swCode],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).then(reg=>{swReg=reg;}).catch(()=>{});
  function askPermission(){ if(Notification.permission==='default'){ Notification.requestPermission().then(p=>{ if(p==='granted') sendNotif('Statista — Notifications On','You will be reminded 30 min before lessons.','info','welcome'); }); } }
  document.addEventListener('click',askPermission,{once:true});
  function sendNotif(title,body,type,tag){ pushNotif(title,body,type||'info'); if(Notification.permission==='granted'){ if(swReg&&swReg.active){ swReg.active.postMessage({type:'NOTIFY',title,body,tag}); } else { new Notification(title,{body}); } } }
  const _sent={};
  setInterval(()=>{ Object.keys(SCHEDULE).forEach(group=>{ const mins=minutesUntilLesson(group); if(mins===null) return; const dateKey=new Date().toDateString(); if(mins>=29&&mins<=31){ const k=`warn_${group}_${dateKey}`; if(!_sent[k]){_sent[k]=true; sendNotif('Homework Reminder',`${group}: lesson in 30 min. Submit missing homework now!`,'reminder','r_'+group);} } if(mins>=-1&&mins<=1){ const k=`start_${group}_${dateKey}`; if(!_sent[k]){_sent[k]=true; sendNotif('Lesson Started',`${group}: lesson begun. Submissions are now closed.`,'blocked','s_'+group);} } }); },60000);
  window._sendTestNotif=function(){ if(Notification.permission!=='granted'){ Notification.requestPermission().then(p=>{if(p==='granted') sendNotif('Test','Notifications are working!','success','test');}); return; } sendNotif('Test Notification','Notifications are working correctly!','success','test'); };
})();

/* ========== DEVTOOLS PROTECTION ========== */
(function devtoolsProtect(){
  document.addEventListener("contextmenu",e=>e.preventDefault());
  document.addEventListener("keydown",e=>{ const k=e.key; const ctrl=e.ctrlKey||e.metaKey; const shift=e.shiftKey; if(k==="F12"||(ctrl&&shift&&["I","i","J","j","C","c"].includes(k))||(ctrl&&["U","u"].includes(k))||(ctrl&&shift&&k==="C")){ e.preventDefault(); e.stopPropagation(); return false; } },true);
  const threshold=160;
  setInterval(()=>{ const widthDiff=window.outerWidth-window.innerWidth; const heightDiff=window.outerHeight-window.innerHeight; if(widthDiff>threshold||heightDiff>threshold){ document.body.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0d0f14;flex-direction:column;gap:16px;"><div style="color:#f7556a;font-size:20px;font-weight:800;font-family:sans-serif;">Access Denied</div><div style="color:#7a8499;font-size:14px;font-family:sans-serif;">Developer tools are not allowed on this page.</div></div>`; } },1000);
  setInterval(()=>{ try{console.clear();}catch(e){} },2000);
})();
